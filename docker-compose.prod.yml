# Override de produção. Uso na VPS:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
services:
  api:
    image: avu-api:${TAG:-latest}
    restart: always
    volumes:
      # secrets como bind mount read-only — gerenciado pelo host
      - /opt/avu-api/secrets:/secrets:ro
    # remove o bind mount de ./app para usar a versão da imagem
    # (sobrescreve o volume do compose base)
    volumes_from: []
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
