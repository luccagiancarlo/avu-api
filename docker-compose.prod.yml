# Override de produção do gateway.
#
# Uso na VPS:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Pré-requisitos no host (mesma máquina):
#   /home/glucca/bff-bb              (com .env e secrets/)
#   /home/glucca/bff-bb-fadec        (com .env e secrets/)
#   /home/glucca/api-vestibular-uem  (com .env — POST /login candidato)
#   /home/glucca/api-auth-ldap       (com .env)
#   /home/glucca/api-webhook-uem     (com .env)
#   /home/glucca/api-webhook-fadec   (com .env)
#   /home/glucca/avu-api             (este projeto)
#
# api-auth foi desativado em 2026-07 (substituído por api-vestibular-uem).

services:
  gateway:
    platform: ""
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  bff-bb:
    platform: ""
    environment:
      APP_ENV: prod
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  bff-bb-fadec:
    platform: ""
    environment:
      APP_ENV: prod
      BB_FORCE_TLS12: "1"
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # api-auth DESATIVADO em 2026-07 — substituído por api-vestibular-uem.
  #
  # api-auth:
  #   platform: ""
  #   environment:
  #     APP_ENV: prod
  #   restart: always
  #   logging:
  #     driver: json-file
  #     options:
  #       max-size: "10m"
  #       max-file: "5"

  api-vestibular-uem:
    platform: ""
    environment:
      APP_ENV: prod
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  api-auth-ldap:
    platform: ""
    environment:
      APP_ENV: prod
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  api-webhook-uem:
    platform: ""
    environment:
      APP_ENV: prod
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  api-webhook-fadec:
    platform: ""
    environment:
      APP_ENV: prod
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
