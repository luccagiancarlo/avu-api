# nginx.conf — gateway reverso /avu/rest/* → bff-bb, api-auth, api-auth-ldap
#
# Recebe requests em :8000 (interno) / :8081 (externo host) espelhando o
# path legado do Java: https://www.npd.uem.br/avu/rest/{rota}
# → é encaminhado para a API certa via rede Docker interna.
#
# Regras:
# - /avu/rest/gruem_pix|gruem_consulta_pix|gruem_webhook → bff-bb
# - /avu/rest/login                                     → api-auth
# - /avu/rest/loginldap                                 → api-auth-ldap
# - /avu/rest/health                                    → health próprio (não repassa)
# - qualquer outra /avu/rest/*                          → 404

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # DNS interno do Docker (permite resolver nomes de serviço em tempo de execução).
    resolver 127.0.0.11 valid=30s ipv6=off;

    # Timeouts razoáveis para APIs internas.
    proxy_connect_timeout 10s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;

    # Log JSON pra facilitar troubleshoot em produção.
    log_format json escape=json '{'
        '"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"method":"$request_method",'
        '"uri":"$request_uri",'
        '"status":$status,'
        '"upstream":"$upstream_addr",'
        '"upstream_status":"$upstream_status",'
        '"upstream_time":"$upstream_response_time",'
        '"bytes_sent":$bytes_sent,'
        '"user_agent":"$http_user_agent"'
        '}';
    access_log /dev/stdout json;
    error_log  /dev/stderr warn;

    # Body sizes maiores para JSON + webhook BB.
    client_max_body_size 2m;

    # Cabeçalhos comuns propagados para as APIs upstream.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;

    server {
        listen 8000 default_server;
        server_name _;

        # Health do próprio proxy.
        location = /avu/rest/health {
            default_type application/json;
            return 200 '{"status":"ok","service":"avu-gateway"}';
        }
        # Alias sem /avu/rest para checks internos do Docker healthcheck.
        location = /health {
            default_type application/json;
            return 200 '{"status":"ok","service":"avu-gateway"}';
        }

        # --------- bff-bb (perfil UEM) ---------
        location = /avu/rest/gruem_pix {
            proxy_pass http://bff-bb:8000/gruem_pix;
        }
        location = /avu/rest/gruem_consulta_pix {
            proxy_pass http://bff-bb:8000/gruem_consulta_pix;
        }

        # --------- bff-bb-fadec (perfil FADEC) ---------
        # Cria PIX e consulta status no BB usando cert/credenciais FADEC.
        # Persiste em sgv.sgv_uem_regi no banco nuvem 212.85.20.149.
        location = /avu/rest/fadec_pix {
            proxy_pass http://bff-bb-fadec:8000/fadec_pix;
        }
        location = /avu/rest/fadec_consulta_pix {
            proxy_pass http://bff-bb-fadec:8000/fadec_consulta_pix;
        }

        # --------- api-webhook-uem ---------
        # Webhook do BB (perfil UEM). Persiste em fin.gr_uem_regi/fin.gr_retorno.
        location = /avu/rest/gruem_webhook {
            proxy_pass http://api-webhook-uem:8000/gruem_webhook;
        }

        # --------- api-webhook-fadec ---------
        # Webhook do BB (perfil FADEC). Persiste em sgv.sgv_uem_regi/sgv.sgv_retorno,
        # nu_convenio=999. Mesmas tabelas cvu.*/res.cr_* que o perfil UEM.
        location = /avu/rest/fadec_webhook {
            proxy_pass http://api-webhook-fadec:8000/fadec_webhook;
        }

        # --------- api-vestibular-uem ---------
        # POST /login do candidato (paridade com LoginResource.fazerLogin do avu-mvn).
        # Substituiu o api-auth (desativado em 2026-07 — nunca existiu no legado,
        # foi um MVP mínimo que virou legado imediato).
        location = /avu/rest/login {
            proxy_pass http://api-vestibular-uem:8000/login;
        }

        # --------- api-auth-ldap ---------
        location = /avu/rest/loginldap {
            proxy_pass http://api-auth-ldap:8000/loginldap;
        }

        # --------- api-id-uem ---------
        # POST /loginemailaluno - identidade institucional (aluno/servidor/UNATI).
        # Retorna AlunoInfo com carteirinha estudantil em base64.
        location = /avu/rest/loginemailaluno {
            proxy_pass http://api-id-uem:8000/loginemailaluno;
        }

        # --------- api-fiscais-uem ---------
        # 6 endpoints consumidos pelo app Flutter app_fiscais_uem.
        location = /avu/rest/loginemail {
            proxy_pass http://api-fiscais-uem:8000/loginemail;
        }
        location = /avu/rest/loginfiscal {
            proxy_pass http://api-fiscais-uem:8000/loginfiscal;
        }
        location = /avu/rest/aceitar {
            proxy_pass http://api-fiscais-uem:8000/aceitar;
        }
        location = /avu/rest/desistir {
            proxy_pass http://api-fiscais-uem:8000/desistir;
        }
        location = /avu/rest/presenca {
            proxy_pass http://api-fiscais-uem:8000/presenca;
        }
        location = /avu/rest/imagem {
            proxy_pass http://api-fiscais-uem:8000/imagem;
        }

        # Qualquer outra coisa sob /avu/rest → 404 explícito (mensagem JSON).
        location /avu/rest/ {
            default_type application/json;
            return 404 '{"detail":"rota nao encontrada no gateway","path":"$request_uri"}';
        }

        # Fora de /avu/rest, também 404.
        location / {
            default_type application/json;
            return 404 '{"detail":"gateway responde apenas sob /avu/rest/*","path":"$request_uri"}';
        }
    }
}
