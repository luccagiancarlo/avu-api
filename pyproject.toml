[project]
name = "avu-api"
version = "0.1.0"
description = "Reescrita FastAPI da AVU NPD UEM (PIX BB + DB2 producao.uem.br)"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi[standard]>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "sqlalchemy[asyncio]>=2.0",
    "ibm-db>=3.2",
    "ibm-db-sa>=0.4",
    "httpx>=0.27",
    "cryptography>=43",
    "python-jose[cryptography]>=3.3",
    "apscheduler>=3.10",
    "structlog>=24.4",
    "alembic>=1.13",
    "tenacity>=9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-httpx>=0.32",
    "aiosqlite>=0.20",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
