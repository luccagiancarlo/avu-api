services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: avu-api:dev
    container_name: avu-api
    env_file: .env
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - ./app:/app/app:ro
      - ./secrets:/secrets:ro
    restart: unless-stopped
    # Em dev, descomente abaixo para hot-reload:
    # command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
