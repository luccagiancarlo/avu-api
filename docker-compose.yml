version: "3.8"

# Compose "guarda-chuva" do ecossistema avu.
#
# Sobe 7 serviços ativos numa única rede interna:
#   - gateway             (nginx)   → externo :8081 (espelha /avu/rest/* do legado)
#   - bff-bb              (fastapi) → só interno via rede docker (PIX UEM)
#   - bff-bb-fadec        (fastapi) → só interno via rede docker (PIX FADEC)
#   - api-vestibular-uem  (fastapi) → só interno via rede docker (POST /login candidato)
#   - api-auth-ldap       (fastapi) → só interno via rede docker
#   - api-webhook-uem     (fastapi) → só interno via rede docker
#   - api-webhook-fadec   (fastapi) → só interno via rede docker
#
# Cada serviço builda a partir da pasta irmã correspondente (../<nome>).
# Requer que os 7 repos estejam clonados lado a lado.
#
# Desativado em 2026-07 (bloco comentado abaixo):
#   - api-auth: substituído por api-vestibular-uem no /login. O MVP original
#     do api-auth nunca existiu no sistema legado; mantemos os arquivos para
#     estudo futuro mas o serviço não sobe.
#
# Para dev local (Mac ARM), o docker-compose puxa `platform: linux/amd64`
# das partes definidas nos compose files individuais dos irmãos — como aqui
# usamos só `build:`, definimos platform explicitamente.

services:
  gateway:
    build:
      context: ./proxy
      dockerfile: Dockerfile
    image: avu-gateway:dev
    container_name: avu-gateway
    platform: linux/amd64
    ports:
      - "${GATEWAY_PORT:-8081}:8000"
    restart: unless-stopped
    depends_on:
      - bff-bb
      - bff-bb-fadec
      - api-vestibular-uem
      - api-auth-ldap
      - api-webhook-uem
      - api-webhook-fadec
      - api-id-uem
    networks:
      - avu-net

  bff-bb:
    build:
      context: ../bff-bb
      dockerfile: Dockerfile
    image: bff-bb:dev
    container_name: bff-bb
    platform: linux/amd64
    env_file:
      - ../bff-bb/.env
    environment:
      APP_ENV: ${APP_ENV:-dev}
    volumes:
      - ../bff-bb/secrets:/secrets:ro
    restart: unless-stopped
    networks:
      - avu-net

  bff-bb-fadec:
    build:
      context: ../bff-bb-fadec
      dockerfile: Dockerfile
    image: bff-bb-fadec:dev
    container_name: bff-bb-fadec
    platform: linux/amd64
    env_file:
      - ../bff-bb-fadec/.env
    environment:
      APP_ENV: ${APP_ENV:-dev}
    volumes:
      - ../bff-bb-fadec/secrets:/secrets:ro
    restart: unless-stopped
    networks:
      - avu-net

  # DESATIVADO em 2026-07: substituído por api-vestibular-uem (POST /login).
  # Mantido comentado para referência histórica. Para reativar: descomente e
  # ajuste a rota /avu/rest/login no proxy/nginx.conf.
  #
  # api-auth:
  #   build:
  #     context: ../api-auth
  #     dockerfile: Dockerfile
  #   image: api-auth:dev
  #   container_name: api-auth
  #   platform: linux/amd64
  #   env_file:
  #     - ../api-auth/.env
  #   environment:
  #     APP_ENV: ${APP_ENV:-dev}
  #   restart: unless-stopped
  #   networks:
  #     - avu-net

  api-vestibular-uem:
    build:
      context: ../api-vestibular-uem
      dockerfile: Dockerfile
    image: api-vestibular-uem:dev
    container_name: api-vestibular-uem
    platform: linux/amd64
    env_file:
      - ../api-vestibular-uem/.env
    environment:
      APP_ENV: ${APP_ENV:-dev}
    restart: unless-stopped
    networks:
      - avu-net

  api-auth-ldap:
    build:
      context: ../api-auth-ldap
      dockerfile: Dockerfile
    image: api-auth-ldap:dev
    container_name: api-auth-ldap
    platform: linux/amd64
    env_file:
      - ../api-auth-ldap/.env
    environment:
      APP_ENV: ${APP_ENV:-dev}
    restart: unless-stopped
    networks:
      - avu-net

  api-webhook-uem:
    build:
      context: ../api-webhook-uem
      dockerfile: Dockerfile
    image: api-webhook-uem:dev
    container_name: api-webhook-uem
    platform: linux/amd64
    env_file:
      - ../api-webhook-uem/.env
    environment:
      APP_ENV: ${APP_ENV:-dev}
    restart: unless-stopped
    networks:
      - avu-net

  api-webhook-fadec:
    build:
      context: ../api-webhook-fadec
      dockerfile: Dockerfile
    image: api-webhook-fadec:dev
    container_name: api-webhook-fadec
    platform: linux/amd64
    env_file:
      - ../api-webhook-fadec/.env
    environment:
      APP_ENV: ${APP_ENV:-dev}
    restart: unless-stopped
    networks:
      - avu-net

  api-id-uem:
    build:
      context: ../api-id-uem
      dockerfile: Dockerfile
    image: api-id-uem:dev
    container_name: api-id-uem
    platform: linux/amd64
    env_file:
      - ../api-id-uem/.env
    environment:
      APP_ENV: ${APP_ENV:-dev}
    volumes:
      - /home/sistemas/SEC:/data/sec:ro
    tmpfs:
      - /tmp/carteira:size=100M
    restart: unless-stopped
    networks:
      - avu-net

networks:
  avu-net:
    name: avu-net
    driver: bridge
